name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "index.html"
      - "styles.css"
      - "app.mobile.css"
      - "app.js"
      - "core.js"
      - "update.js"
      - "series-stats.js"
      - "widget.html"
      - "widget.css"
      - "widget.js"
      - "sw.js"
      - "sync.js"
      - "notifications.js"
      - "sync-server/**"
      - "tests/**"
      - "manifest.webmanifest"
      - "favicon.svg"
      - "assets/**"
      - "native/**"
      - "tools/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run checks
        run: npm run check && npm test

      - name: Build web assets
        run: npm run build:web

      - name: Install Chrome for the browser smoke run
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run browser smoke
        run: npm run smoke

      - name: Add Android platform
        run: npx cap add android
        env:
          CI: "true"

      - name: Apply native widget, icons and splash screens
        run: node tools/patch-android.js

      - name: Verify Android project
        run: node tools/verify-android.js

      - name: Restore signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Основная сборка для людей — release с постоянным ключом. Без ключа
            # публиковать нечего: debug с одноразовой подписью не обновится
            # поверх и молча подменит собой нормальную сборку. Поэтому падаем.
            echo "::error::Signing secrets are missing — a release APK cannot be built. Add KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/pixel-release.p12
          cat > android/keystore.properties <<EOF
          storeFile=app/pixel-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=yes" >> "$GITHUB_OUTPUT"
          echo "Signing keystore restored"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Пакет "tools" удалён из cmdline-tools 16.0 — ставим только platform-tools,
          # нужные platforms/build-tools ставим шагом ниже.
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          if [ ! -f keystore.properties ]; then
            echo "::error::keystore.properties is missing — release build is the one users install, it must not be skipped."
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pixel-calendar-2027-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk pixel-calendar-2027-release.apk

      - name: Report APK signature and flags
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)"
          : > apk-fingerprints.txt
          for apk in pixel-calendar-2027-debug.apk pixel-calendar-2027-release.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk =="
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$apk" || true
              "$APKSIGNER" verify --print-certs "$apk" | sed -n "s/^.*certificate SHA-256 digest: //p" | head -1 | sed "s|^|$apk: |" >> apk-fingerprints.txt
            fi
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$apk" | grep -E "^package:" || true
              "$AAPT" dump xmltree --file AndroidManifest.xml "$apk" | grep -i "debuggable" || echo "debuggable=true (не задан)"
            fi
          done
          test -f pixel-calendar-2027-release.apk || { echo "::error::Release APK is absent — nothing to install for users."; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pixel-calendar-2027-debug
          path: pixel-calendar-2027-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pixel-calendar-2027-release
          path: pixel-calendar-2027-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_APK=pixel-calendar-2027-release.apk
          DEBUG_APK=pixel-calendar-2027-debug.apk
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK is missing — a tag must never publish a debug-only release."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)"
          VERSION_CODE="$("$AAPT" dump badging "$RELEASE_APK" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          FINGERPRINT="$(sed -n "s|^$RELEASE_APK: ||p" apk-fingerprints.txt | head -1)"
          {
            echo "**Version:** $VERSION (\`$GITHUB_REF_NAME\`)"
            echo
            echo "**versionCode:** ${VERSION_CODE:-unknown}"
            echo
            echo "**Signing certificate (SHA-256):** \`${FINGERPRINT:-unknown}\`"
            echo
            echo "| file | size | sha256 |"
            echo "| --- | --- | --- |"
            for apk in "$RELEASE_APK" "$DEBUG_APK"; do
              [ -f "$apk" ] || continue
              echo "| \`$apk\` | $(du -h "$apk" | cut -f1) | \`$(sha256sum "$apk" | cut -d' ' -f1)\` |"
            done
          } > release-notes.md
          cat release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_APK" "$DEBUG_APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_APK" "$DEBUG_APK" \
              --verify-tag --latest \
              --title "v$VERSION — Pixel Calendar" \
              --notes-file release-notes.md
          fi
