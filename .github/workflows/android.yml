name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "styles.css"
      - "app.mobile.css"
      - "app.js"
      - "update.js"
      - "series-stats.js"
      - "widget.html"
      - "widget.css"
      - "widget.js"
      - "sw.js"
      - "sync.js"
      - "notifications.js"
      - "sync-server/**"
      - "tests/**"
      - "manifest.webmanifest"
      - "favicon.svg"
      - "assets/**"
      - "native/**"
      - "tools/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run checks
        run: npm run check && npm test

      - name: Install Chrome for the browser smoke run
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run browser smoke
        run: npm run smoke

      - name: Build web assets
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android
        env:
          CI: "true"

      - name: Apply native widget, icons and splash screens
        run: node tools/patch-android.js

      - name: Verify Android project
        run: node tools/verify-android.js

      - name: Restore signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing — the APK will be signed with a throwaway debug key and will not update over previous installs."
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/pixel-release.p12
          cat > android/keystore.properties <<EOF
          storeFile=app/pixel-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=yes" >> "$GITHUB_OUTPUT"
          echo "Signing keystore restored"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Пакет "tools" удалён из cmdline-tools 16.0 — ставим только platform-tools,
          # нужные platforms/build-tools ставим шагом ниже.
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "::warning::Release build skipped: signing secrets are missing."
          fi

      - name: Copy APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pixel-calendar-2027-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk pixel-calendar-2027-release.apk
          fi

      - name: Report APK signature and flags
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)"
          for apk in pixel-calendar-2027-debug.apk pixel-calendar-2027-release.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk =="
            [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs "$apk" || true
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$apk" | grep -E "^package:" || true
              "$AAPT" dump xmltree --file AndroidManifest.xml "$apk" | grep -i "debuggable" || echo "debuggable=true (не задан)"
            fi
          done
          test -f pixel-calendar-2027-release.apk || { echo "::notice::Release APK is absent (no signing key): publishing the debug build only."; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pixel-calendar-2027-debug
          path: pixel-calendar-2027-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pixel-calendar-2027-release
          path: pixel-calendar-2027-release.apk
          if-no-files-found: warn
          retention-days: 90
