name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "styles.css"
      - "app.mobile.css"
      - "app.js"
      - "widget.html"
      - "widget.css"
      - "widget.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "favicon.svg"
      - "assets/**"
      - "native/**"
      - "tools/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android
        env:
          CI: "true"

      - name: Apply native widget, icons and splash screens
        run: node tools/patch-android.js

      - name: Verify Android project
        run: node tools/verify-android.js

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing — the APK will be signed with a throwaway debug key and will not update over previous installs."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/pixel-release.p12
          cat > android/keystore.properties <<EOF
          storeFile=app/pixel-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Signing keystore restored"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Пакет "tools" удалён из cmdline-tools 16.0 — ставим только platform-tools,
          # нужные platforms/build-tools ставим шагом ниже.
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pixel-calendar-2027-debug.apk

      - name: Report APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found, skipping signature report"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs pixel-calendar-2027-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: pixel-calendar-2027-debug
          path: pixel-calendar-2027-debug.apk
          if-no-files-found: error
          retention-days: 7
