name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "widget.html"
      - "widget.css"
      - "widget.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "favicon.svg"
      - "assets/**"
      - "native/**"
      - "tools/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android
        env:
          CI: "true"

      - name: Apply native widget, icons and splash screens
        run: node tools/patch-android.js

      - name: Verify Android project
        run: node tools/verify-android.js

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pixel-calendar-2027-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-calendar-2027-debug
          path: pixel-calendar-2027-debug.apk
          if-no-files-found: error
          retention-days: 30
